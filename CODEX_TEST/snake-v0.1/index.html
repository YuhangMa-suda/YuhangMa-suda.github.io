<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <h1>Snake Game</h1>
    <section class="panel">
      <p>Score: <span id="score">0</span></p>
      <p>Best: <span id="best">0</span></p>
    </section>

    <canvas id="game" width="400" height="400" aria-label="Snake game canvas"></canvas>

    <section class="actions">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="restartBtn">Restart</button>
    </section>

    <section class="tips">
      <p>Control: Arrow keys / WASD</p>
      <p>Rule: Eat food to grow. Hit wall or yourself and game over.</p>
    </section>

    <section class="mobile-pad" aria-label="Mobile direction pad">
      <div></div>
      <button data-dir="up">U</button>
      <div></div>
      <button data-dir="left">L</button>
      <button data-dir="down">D</button>
      <button data-dir="right">R</button>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
